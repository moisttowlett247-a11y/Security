name: Synapse-XDR Autonomous Threat Intelligence & GitHub Pages Deployment

on:
  push:
    branches: [ "main" ]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  threat-intelligence-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Automated Threat Intelligence Engine
        env:
          ENVIRONMENT: "production"
          VAULT_ENCRYPTION_KEY: ${{ secrets.VAULT_ENCRYPTION_KEY }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          echo "Executing automated OSINT threat intelligence collection..."
          python3 threat_engine.py

      - name: Configure Git Credentials for Auto-Commit
        run: |
          git config --global user.name "synapse-security-bot[bot]"
          git config --global user.email "synapse-security-bot[bot]@users.noreply.github.com"

      - name: Commit & Push Updated Threat Telemetry
        run: |
          git status
          git add static/threat_data.json
          git diff --staged --quiet || git commit -m "chore(telemetry): update automated live threat intelligence payload [skip ci]"
          git push origin main
        continue-on-error: true

      - name: Deploy Static Artifacts to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./static
          publish_branch: gh-pages
          commit_message: "deploy(dashboard): publish serverless security command center [skip ci]"
          force_orphan: false
